repository: "jebel-quant/rhiza"
ref: "v1.5.1"

profiles:
  - github-project
templates:
  - legal
  - github-paper

# Destination paths, as they land in this repo. Source-path entries
# (bundles/github/...) are inert since the exclude semantics were fixed.
exclude:
  # SECURITY.md makes factual claims about THIS repo's security posture (which scanners,
  # which release protections). Only the repo knows which are true, so the file is owned
  # here rather than template-managed.
  - SECURITY.md

  # Documents the PAT_TOKEN / secrets setup for the rhiza_*.yml workflows. This repo
  # configures its own secrets and does not need the template's walkthrough carried in
  # tree; deleted in #956 and excluded here so the sync stops restoring it.
  - .github/CONFIG.md

  # (The .github/ISSUE_TEMPLATE and .github/DISCUSSION_TEMPLATE excludes are gone: rhiza
  # v1.5.0 removed those forms upstream, so there is nothing left to exclude.)

  - .github/workflows/rhiza_fuzzing.yml
  - .github/workflows/rhiza_weekly.yml
  - .github/workflows/rhiza_scorecard.yml
